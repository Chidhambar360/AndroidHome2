// Full app module Gradle file (Groovy DSL).
// Overwrite app/build.gradle with this, then in Android Studio: Sync Project with Gradle Files -> Clean -> Rebuild.

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    // REQUIRED: module namespace (AGP 7.1+)
    namespace "com.example.keyboardlauncher"

    compileSdkVersion 33

    defaultConfig {
        applicationId "com.example.keyboardlauncher"
        minSdkVersion 23
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Java 8 compatibility
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Enable viewBinding so generated binding classes are available
    buildFeatures {
        viewBinding true
    }

    // Kotlin compiler options
    kotlinOptions {
        jvmTarget = "1.8"
    }
}

dependencies {
    // Kotlin stdlib (match your project's kotlin version if defined elsewhere)
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.0"

    // AndroidX and common libs
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0-alpha01'

    // Unit tests (JVM)
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlin:kotlin-test:1.8.0'
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit:1.8.0'

    // Android instrumented tests (on-device / emulator)
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // Optional helpful testing libs (uncomment if you plan to use them)
    // testImplementation 'org.mockito:mockito-core:4.+'
    // androidTestImplementation 'androidx.test:core:1.5.0'
}